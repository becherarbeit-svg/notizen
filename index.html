<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notizen">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Notizen</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#86868b; --accent:#0a7cff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text);
         padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size:28px; margin:8px 0 16px; }
  textarea { width:100%; min-height:110px; font:inherit; font-size:17px; padding:12px; border:none;
             border-radius:12px; background:var(--card); color:var(--text); resize:vertical; }
  .row { display:flex; gap:8px; margin:10px 0 24px; }
  button { font:inherit; font-size:16px; border:none; border-radius:10px; padding:10px 16px; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; flex:1; }
  .secondary { background:var(--card); color:var(--text); }
  ul { list-style:none; padding:0; margin:0; }
  li { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; }
  .txt { white-space:pre-wrap; word-wrap:break-word; }
  .meta { color:var(--muted); font-size:13px; margin-top:6px; display:flex; justify-content:space-between; align-items:center; }
  .meta button { background:none; color:var(--accent); padding:4px 8px; font-size:14px; }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
</style>
</head>
<body>
  <h1>Notizen</h1>
  <textarea id="input" placeholder="Neuer Eintrag …"></textarea>
  <div class="row">
    <button class="primary" id="save">Speichern</button>
    <button class="secondary" id="cancel" hidden>Abbrechen</button>
  </div>
  <ul id="list"></ul>

<script>
  const KEY = 'notizen';
  const input = document.getElementById('input');
  const saveBtn = document.getElementById('save');
  const cancelBtn = document.getElementById('cancel');
  const list = document.getElementById('list');
  let editId = null;

  const load = () => JSON.parse(localStorage.getItem(KEY) || '[]');
  const store = notes => localStorage.setItem(KEY, JSON.stringify(notes));

  function render() {
    const notes = load().sort((a, b) => b.updated - a.updated);
    list.innerHTML = '';
    if (!notes.length) { list.innerHTML = '<p class="empty">Noch keine Einträge.</p>'; return; }
    for (const n of notes) {
      const li = document.createElement('li');
      li.innerHTML = `<div class="txt"></div>
        <div class="meta"><span>${new Date(n.updated).toLocaleString('de-DE')}</span>
        <span><button data-edit>Bearbeiten</button><button data-del>Löschen</button></span></div>`;
      li.querySelector('.txt').textContent = n.text;
      li.querySelector('[data-edit]').onclick = () => startEdit(n);
      li.querySelector('[data-del]').onclick = () => {
        if (confirm('Eintrag löschen?')) { store(load().filter(x => x.id !== n.id)); render(); }
      };
      list.appendChild(li);
    }
  }

  function startEdit(n) {
    editId = n.id; input.value = n.text;
    saveBtn.textContent = 'Änderung speichern'; cancelBtn.hidden = false;
    input.focus(); window.scrollTo(0, 0);
  }

  function reset() {
    editId = null; input.value = '';
    saveBtn.textContent = 'Speichern'; cancelBtn.hidden = true;
  }

  saveBtn.onclick = () => {
    const text = input.value.trim();
    if (!text) return;
    const notes = load();
    if (editId) {
      const n = notes.find(x => x.id === editId);
      if (n) { n.text = text; n.updated = Date.now(); }
    } else {
      notes.push({ id: Date.now().toString(36), text, updated: Date.now() });
    }
    store(notes); reset(); render();
  };
  cancelBtn.onclick = reset;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  render();
</script>
</body>
</html>
